<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Invoice Management — ZeniaHR</title>
<!-- Web fonts load when online; the stack below falls back to a clean system sans offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════════════════════════════
   ZeniaHR design tokens — mirrored from the application's index.css.
   ════════════════════════════════════════════════════════════════════════════ */
:root{
  --brand-50:#FCF4EE; --brand-100:#F7E3D3; --brand-200:#F0CBAE; --brand-300:#E8B088;
  --brand-400:#E0996A; --brand-500:#C77E52; --brand-600:#B5673A; --brand-700:#99552F;

  --surface-canvas:#F8FAFC; --surface-raised:#FFFFFF; --surface-muted:#F1F5F9;
  --surface-border:#E2E8F0; --surface-hover:rgba(199,126,82,.07);
  --ink-primary:#0F172A; --ink-secondary:#475569; --ink-muted:#64748B;

  --slate-50:#F8FAFC; --slate-100:#F1F5F9; --slate-150:#EDF1F6; --slate-200:#E2E8F0;
  --slate-300:#CBD5E1; --slate-400:#94A3B8; --slate-500:#64748B; --slate-600:#475569;
  --slate-700:#334155; --slate-800:#1E293B; --slate-900:#0F172A;

  --emerald-50:#ECFDF5; --emerald-200:#A7F3D0; --emerald-500:#10B981; --emerald-600:#059669; --emerald-700:#047857;
  --amber-50:#FFFBEB; --amber-100:#FEF3C7; --amber-200:#FDE68A; --amber-500:#F59E0B; --amber-600:#D97706; --amber-700:#B45309;
  --orange-50:#FFF7ED; --orange-500:#F97316; --orange-600:#EA580C; --orange-700:#C2410C;
  --rose-50:#FFF1F2; --rose-200:#FECDD3; --rose-500:#F43F5E; --rose-600:#E11D48; --rose-700:#BE123C;
  --blue-50:#EFF6FF; --blue-200:#BFDBFE; --blue-500:#3B82F6; --blue-700:#1D4ED8;
  --red-50:#FEF2F2; --red-200:#FECACA; --red-700:#B91C1C;

  --radius-card:16px;
  --shadow-xs:0 1px 2px rgba(17,24,39,.04);
  --shadow-sm:0 1px 3px rgba(17,24,39,.08);
  --shadow-card:0 1px 2px rgba(17,24,39,.04), 0 4px 16px rgba(17,24,39,.06);
  --shadow-card-hover:0 2px 4px rgba(17,24,39,.05), 0 12px 28px rgba(17,24,39,.10);

  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --font-heading:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}

*,*::before,*::after{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font-sans);background:var(--surface-canvas);color:var(--ink-primary);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
button,input,select,textarea{font-family:inherit;}
svg{display:block;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--slate-300);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:var(--slate-400);}

/* ── App shell ───────────────────────────────────────────────────────────── */
.app{display:flex;height:100vh;overflow:hidden;}
.sidebar{
  width:256px;flex-shrink:0;display:flex;flex-direction:column;
  background:linear-gradient(to bottom,#1E293B,#161F2E);color:var(--slate-300);
  box-shadow:1px 0 0 rgba(15,23,42,.06);transition:width .3s ease;
}
.sidebar-logo{display:flex;align-items:center;gap:12px;padding:0 16px;height:72px;border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0;}
.logo-mark{width:38px;height:38px;border-radius:22%;flex-shrink:0;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.3);font-family:var(--font-heading);font-weight:800;font-size:20px;color:var(--brand-500);}
.logo-text{min-width:0;flex:1;}
.logo-name{font-family:var(--font-heading);font-size:16px;font-weight:700;color:#fff;line-height:1.15;letter-spacing:-.01em;margin:0;}
.logo-role{font-size:10px;color:var(--brand-300);margin:2px 0 0;text-transform:uppercase;letter-spacing:.12em;font-weight:700;}
.sidebar-nav{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:4px;}
.nav-item{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:0;background:transparent;cursor:pointer;font-size:15px;letter-spacing:-.01em;color:#E2E8F0;font-weight:500;text-align:left;transition:all .2s ease;}
.nav-item:hover{background:rgba(199,126,82,.15);color:#fff;}
.nav-item:hover .nav-icon{color:var(--brand-400);}
.nav-item.active{background:var(--brand-500);color:#fff;font-weight:600;box-shadow:0 6px 16px -4px rgba(199,126,82,.55);}
.nav-item.active .nav-icon{color:#fff;}
.nav-item:active{transform:scale(.98);}
.nav-icon{flex-shrink:0;color:#CBD5E1;transition:all .2s ease;}
.nav-label{flex:1;min-width:0;}
.sidebar-foot{padding:16px;border-top:1px solid rgba(255,255,255,.1);}
.sidebar-foot p{margin:0;font-size:10px;color:var(--slate-500);font-weight:700;letter-spacing:.08em;}

.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;}
.topbar{height:72px;flex-shrink:0;background:#fff;border-bottom:1px solid var(--surface-border);display:flex;align-items:center;gap:16px;padding:0 24px;}
.topbar h1{font-family:var(--font-heading);font-size:18px;font-weight:700;color:var(--ink-primary);margin:0;letter-spacing:-.01em;}
.icon-btn{width:38px;height:38px;border-radius:10px;border:0;background:transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--slate-500);transition:background .2s ease,color .2s ease;position:relative;}
.icon-btn:hover{background:var(--surface-muted);color:var(--brand-600);}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.bell-badge{position:absolute;top:2px;right:2px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#EC4899;color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.avatar{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#D68F63,#B5673A);}
.content{flex:1;overflow-y:auto;padding:24px;}

/* ── Cards ───────────────────────────────────────────────────────────────── */
.card{background:var(--surface-raised);border:1px solid var(--surface-border);border-radius:var(--radius-card);box-shadow:var(--shadow-card);overflow:hidden;}
.card-pad{padding:20px;}
.module-head{
  border-radius:16px;border:1px solid var(--brand-100);background:#fff;padding:12px 16px;
  box-shadow:var(--shadow-sm);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.module-head h2{margin:0;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;color:var(--slate-800);}
.module-head p{margin:2px 0 0;font-size:11px;color:var(--slate-400);}
.kpi{border-radius:12px;border:1px solid var(--slate-200);background:#fff;padding:16px;transition:box-shadow .2s ease,transform .2s ease,border-color .2s ease;}
.kpi:hover{box-shadow:var(--shadow-card-hover);border-color:var(--brand-200);transform:translateY(-2px);}
.kpi-ico{margin-bottom:8px;display:flex;height:32px;width:32px;align-items:center;justify-content:center;border-radius:8px;background:var(--brand-50);color:var(--brand-500);}
.kpi-val{margin:0;font-size:20px;font-weight:800;color:var(--slate-800);}
.kpi-lbl{margin:2px 0 0;font-size:11px;font-weight:600;color:var(--slate-400);}
.money-card{background:#fff;border:1px solid var(--slate-200);border-radius:12px;padding:12px 16px;}
.money-card .lbl{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--slate-500);}
.money-card .val{margin-top:4px;font-size:19px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}
.count-card{background:#fff;border:1px solid var(--slate-200);border-radius:12px;padding:10px 16px;text-align:center;}
.count-card .val{font-size:18px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}
.count-card .lbl{margin-top:4px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--slate-500);}

/* ── Buttons ─────────────────────────────────────────────────────────────── */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;white-space:nowrap;
  cursor:pointer;user-select:none;border-radius:12px;border:1px solid var(--btn-border);
  background:var(--btn-bg);color:var(--btn-fg);box-shadow:var(--btn-shadow,none);
  transition:background .2s ease,border-color .2s ease,box-shadow .2s ease,color .2s ease,transform .15s ease;
}
.btn:not(:disabled):hover{background:var(--btn-bg-hover);border-color:var(--btn-border-hover,var(--btn-border));box-shadow:var(--btn-shadow-hover,var(--btn-shadow,none));transform:translateY(-1px);}
.btn:not(:disabled):active{transform:scale(.985);}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none;}
.btn:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(199,126,82,.25);}
.btn-md{height:42px;padding:0 18px;font-size:13px;}
.btn-sm{height:36px;padding:0 14px;font-size:12px;}
.btn-xs{height:28px;padding:0 10px;font-size:11px;}
.btn-primary{--btn-bg:linear-gradient(135deg,#D68F63 0%,#C77E52 100%);--btn-bg-hover:linear-gradient(135deg,#C77E52 0%,#B5673A 100%);--btn-fg:#fff;--btn-border:transparent;--btn-shadow:0 4px 12px rgba(199,126,82,.18);--btn-shadow-hover:0 8px 20px rgba(199,126,82,.25);}
.btn-secondary{--btn-bg:#fff;--btn-bg-hover:#FCF4EE;--btn-fg:#C77E52;--btn-border:#F0CBAE;--btn-border-hover:#C77E52;}
.btn-success{--btn-bg:#ECFDF5;--btn-bg-hover:#DCFCE7;--btn-fg:#15803D;--btn-border:#BBF7D0;--btn-border-hover:#86EFAC;}
.btn-danger{--btn-bg:#FEF2F2;--btn-bg-hover:#FEE2E2;--btn-fg:#DC2626;--btn-border:#FECACA;--btn-border-hover:#FCA5A5;}
.btn-outline{--btn-bg:var(--surface-raised);--btn-bg-hover:var(--brand-50);--btn-fg:var(--ink-secondary);--btn-border:var(--surface-border);--btn-border-hover:var(--brand-300);}
.btn-outline:not(:disabled):hover{color:var(--brand-500);}
.btn-ghost{--btn-bg:transparent;--btn-bg-hover:var(--surface-hover);--btn-fg:var(--ink-secondary);--btn-border:transparent;}
.btn-ghost:not(:disabled):hover{color:var(--brand-500);}

/* ── Tabs (nav-tab language from index.css) ──────────────────────────────── */
.tabs{display:flex;flex-wrap:wrap;align-items:center;gap:4px;border-bottom:1px solid var(--slate-200);}
.nav-tab{
  display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:12px;white-space:nowrap;
  margin-bottom:-1px;border:0;border-bottom:2px solid transparent;background:transparent;
  color:#6B7280;font-weight:600;cursor:pointer;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease;
}
.nav-tab:hover{background:var(--brand-50);color:var(--brand-600);}
.nav-tab.active,.nav-tab.active:hover{background:transparent;border-bottom-color:var(--brand-500);color:var(--brand-700);font-weight:700;}
.nav-tab:focus-visible{outline:2px solid var(--brand-500);outline-offset:2px;}
.tab-div{margin:0 8px;height:20px;width:1px;background:var(--slate-200);align-self:center;}
.tab-setup{align-self:center;padding-right:4px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--slate-300);user-select:none;}

/* ── Badges ──────────────────────────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:11px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;}
.badge-green{background:var(--emerald-50);color:var(--emerald-700);border:1px solid var(--emerald-200);}
.badge-blue{background:var(--blue-50);color:var(--blue-700);border:1px solid var(--blue-200);}
.badge-amber{background:var(--amber-50);color:var(--amber-700);border:1px solid var(--amber-200);}
.badge-gray{background:var(--surface-muted);color:var(--ink-secondary);border:1px solid var(--surface-border);}
.badge-red{background:var(--red-50);color:var(--red-700);border:1px solid var(--red-200);}

/* ── Forms ───────────────────────────────────────────────────────────────── */
.field-label{display:block;font-size:11px;font-weight:700;color:var(--slate-600);margin-bottom:6px;}
.input,.select{width:100%;height:42px;padding:0 12px;border-radius:12px;border:1px solid var(--surface-border);background:#fff;font-size:13px;color:var(--ink-primary);outline:none;transition:border-color .2s ease,box-shadow .2s ease;}
.input:focus,.select:focus{border-color:var(--brand-500);box-shadow:0 0 0 3px rgba(199,126,82,.10);}
.select{appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center;padding-right:32px;}
.filter-sel{border-radius:12px;border:1px solid var(--slate-200);background:#fff;padding:8px 12px;font-size:12px;color:var(--ink-primary);outline:none;cursor:pointer;}
.filter-sel:focus{border-color:var(--brand-500);}
.search-wrap{position:relative;display:inline-flex;align-items:center;}
.search-wrap svg{position:absolute;left:12px;color:var(--slate-400);pointer-events:none;}
.search-wrap input{width:224px;border-radius:12px;border:1px solid var(--slate-200);background:#fff;padding:8px 12px 8px 34px;font-size:12px;outline:none;}
.search-wrap input:focus{border-color:var(--brand-500);}

/* ── Tables ──────────────────────────────────────────────────────────────── */
.table-scroll{overflow-x:auto;}
table.data{width:100%;border-collapse:collapse;text-align:left;font-size:12px;}
table.data thead{background:var(--slate-50);}
table.data thead th{padding:12px;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--slate-500);font-weight:600;white-space:nowrap;border-bottom:1px solid var(--slate-200);}
table.data tbody tr{border-top:1px solid var(--slate-100);border-left:4px solid transparent;transition:all .2s ease;}
table.data tbody td{padding:12px;vertical-align:middle;}
tr.clickable{cursor:pointer;}
tr.clickable:hover{background:var(--slate-50);box-shadow:var(--shadow-sm);border-left-color:var(--brand-500);}
tr.clickable:focus{outline:none;background:var(--slate-50);box-shadow:var(--shadow-sm);border-left-color:var(--brand-500);}
.col-r{text-align:right;} .col-c{text-align:center;}
.num{font-variant-numeric:tabular-nums;}
.row-btn{border:0;background:transparent;cursor:pointer;padding:6px;border-radius:8px;color:var(--slate-400);display:inline-flex;transition:background .15s ease,color .15s ease;}
.row-btn:hover{background:var(--brand-50);color:var(--brand-600);}
.row-btn.emerald:hover{background:var(--emerald-50);color:var(--emerald-600);}
.row-btn.amber:hover{background:var(--amber-50);color:var(--amber-600);}
.row-btn.rose:hover{background:var(--rose-50);color:var(--rose-600);}

/* ── Modal ───────────────────────────────────────────────────────────────── */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;animation:fadeIn .18s ease;}
.overlay[hidden]{display:none;}
.modal{background:#fff;border-radius:16px;box-shadow:0 24px 60px rgba(15,23,42,.25);width:100%;max-height:90vh;display:flex;flex-direction:column;animation:slideUp .22s cubic-bezier(.16,1,.3,1);}
.modal-sm{max-width:440px;} .modal-md{max-width:680px;} .modal-lg{max-width:900px;}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px;border-bottom:1px solid var(--slate-100);}
.modal-head h3{margin:0;font-family:var(--font-heading);font-size:16px;font-weight:700;color:var(--slate-900);}
.modal-body{padding:22px;overflow-y:auto;flex:1;}
.modal-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:16px 22px;border-top:1px solid var(--slate-100);background:var(--slate-50);border-radius:0 0 16px 16px;flex-wrap:wrap;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ── Toast ───────────────────────────────────────────────────────────────── */
.toasts{position:fixed;bottom:24px;right:24px;z-index:200;display:flex;flex-direction:column;gap:8px;}
.toast{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--surface-border);border-left:4px solid var(--brand-500);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow-card-hover);font-size:13px;font-weight:500;color:var(--slate-700);animation:slideIn .25s cubic-bezier(.16,1,.3,1);min-width:260px;}
.toast.success{border-left-color:var(--emerald-500);}
.toast.info{border-left-color:var(--blue-500);}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}

/* ── Layout helpers ──────────────────────────────────────────────────────── */
.stack{display:flex;flex-direction:column;gap:16px;}
.stack-sm{display:flex;flex-direction:column;gap:12px;}
.row{display:flex;align-items:center;gap:8px;}
.row-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.spacer{margin-left:auto;}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;}
.grid-6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;}
.grid-5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;}
.kv{display:flex;align-items:center;justify-content:space-between;padding:4px 0;font-size:12px;}
.kv span:first-child{color:var(--slate-500);}
.kv span:last-child{font-weight:600;color:var(--slate-700);}
.section-title{font-size:12px;font-weight:700;color:var(--slate-700);text-transform:uppercase;letter-spacing:.05em;margin:0 0 12px;}
.empty{padding:56px 0;text-align:center;color:var(--slate-400);}
.empty p{margin:8px 0 0;font-size:14px;font-weight:600;color:var(--slate-500);}
.empty small{font-size:12px;}
.chart{display:flex;align-items:flex-end;gap:12px;height:160px;}
.chart .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.chart .bar{width:100%;border-radius:4px 4px 0 0;background:rgba(199,126,82,.8);transition:background .2s ease;}
.chart .bar-col:hover .bar{background:var(--brand-600);}
.chart small{font-size:9px;color:var(--slate-400);}
.recent-row{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;padding:6px 8px;border:0;border-radius:8px;background:transparent;cursor:pointer;text-align:left;}
.recent-row:hover{background:var(--slate-50);}
.dev-banner{display:flex;align-items:flex-start;gap:10px;border-radius:12px;border:1px solid var(--amber-200);background:var(--amber-50);padding:12px 14px;}
.dev-banner p{margin:0;font-size:12px;color:var(--amber-800,#92400E);}
.dev-banner strong{display:block;font-size:12px;margin-bottom:2px;}
.hidden{display:none !important;}

/* ── Print (Download / Print invoice — demo) ─────────────────────────────── */
#printArea{display:none;}
@media print{
  body *{visibility:hidden !important;}
  #printArea,#printArea *{visibility:visible !important;}
  #printArea{display:block !important;position:absolute;left:0;top:0;width:100%;padding:32px;}
  @page{size:A4 portrait;margin:14mm;}
}
.doc{font-size:12px;color:#0F172A;}
.doc h1{font-family:var(--font-heading);font-size:22px;margin:0;letter-spacing:-.02em;}
.doc table{width:100%;border-collapse:collapse;margin-top:14px;}
.doc th{background:#F1F5F9;text-align:left;padding:8px;font-size:10px;text-transform:uppercase;letter-spacing:.05em;border:1px solid #E2E8F0;}
.doc td{padding:8px;border:1px solid #E2E8F0;}

/* ── Responsive ──────────────────────────────────────────────────────────── */
@media (max-width:1280px){ .grid-6{grid-template-columns:repeat(3,minmax(0,1fr));} .grid-5{grid-template-columns:repeat(3,minmax(0,1fr));} }
@media (max-width:1024px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:60;transform:translateX(-100%);transition:transform .3s ease;}
  .sidebar.open{transform:translateX(0);}
  .scrim{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:55;}
  .scrim[hidden]{display:none;}
  .grid-4{grid-template-columns:repeat(2,minmax(0,1fr));}
  .grid-2{grid-template-columns:1fr;}
}
@media (max-width:768px){

const r2 = n => Math.round((Number(n) || 0) * 100) / 100;

/** Client mirror of services/invoiceCalc — CGST/SGST intra-state, IGST otherwise. */
function computeInvoice(items, intraState){
  const lines = items.map(it => {
    const gross   = r2(it.quantity * it.rate);
    const taxable = gross;
    const tax     = r2(taxable * it.taxRate / 100);
    const cgst    = intraState ? r2(tax / 2) : 0;
    const sgst    = intraState ? r2(tax - cgst) : 0;
    const igst    = intraState ? 0 : tax;
    return Object.assign({}, it, { gross, taxable, cgst, sgst, igst, amount:r2(taxable + tax) });
  });
  const sum = k => r2(lines.reduce((s, l) => s + (l[k] || 0), 0));
  const taxableAmount = sum('taxable');
  const cgst = sum('cgst'), sgst = sum('sgst'), igst = sum('igst');
  const preRound   = r2(taxableAmount + cgst + sgst + igst);
  const grandTotal = Math.round(preRound);
  return { lines, taxableAmount, cgst, sgst, igst, roundOff:r2(grandTotal - preRound), grandTotal };
}

    items:calc.lines, taxableAmount:calc.taxableAmount,
    cgst:calc.cgst, sgst:calc.sgst, igst:calc.igst, roundOff:calc.roundOff,
    grandTotal:calc.grandTotal, amountPaid,
    balanceDue:status === 'Cancelled' ? 0 : r2(calc.grandTotal - amountPaid),
    payments,
  };
});

const inr = n => '₹' + (Number(n) || 0).toLocaleString('en-IN', { minimumFractionDigits:2, maximumFractionDigits:2 });
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => (
  { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const $ = id => document.getElementById(id);

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function formatDate(iso){
  if (!iso) return '—';
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (!m) return '—';
  return m[3] + ' ' + MONTHS[Number(m[2]) - 1] + ' ' + m[1];
}

const STATUS_TONE = { Draft:'gray', Generated:'blue', Sent:'blue', Viewed:'blue',
  'Partially Paid':'amber', Paid:'green', Closed:'green', Cancelled:'red' };
const statusBadge = s => '<span class="badge badge-' + (STATUS_TONE[s] || 'gray') + '">' + esc(s) + '</span>';

function toast(msg, kind){
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || 'success');
  el.innerHTML = svg(kind === 'info' ? 'clock' : 'check-circle', 16) + '<span>' + esc(msg) + '</span>';
  $('toasts').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateX(20px)';
    el.style.transition = 'all .25s ease'; setTimeout(() => el.remove(), 260); }, 2800);
}

/** Whole-book KPIs — deliberately NOT derived from the filtered table. */
function kpis(){
  const live = INVOICES.filter(i => i.status !== 'Cancelled');
  const k = {
    totalInvoiced:0, totalRevenue:0, outstanding:0,
    live:live.length, draft:0, generated:0, sent:0, partiallyPaid:0, paid:0, cancelled:0, unpaid:0, overdue:0,
  };
  const today = new Date('2026-06-30');
  INVOICES.forEach(i => {
    if (i.status === 'Cancelled'){ k.cancelled++; return; }
    k.totalInvoiced += i.grandTotal;
    k.totalRevenue  += i.amountPaid;
    k.outstanding   += i.balanceDue;
    if (i.status === 'Draft') k.draft++;
    if (i.status === 'Generated') k.generated++;
    if (i.status === 'Sent') k.sent++;
    if (i.status === 'Partially Paid') k.partiallyPaid++;
    if (i.status === 'Paid') k.paid++;
    if (i.amountPaid === 0 && i.status !== 'Draft') k.unpaid++;
    if (i.balanceDue > 0 && i.dueDate && new Date(i.dueDate) < today) k.overdue++;
  });
  return k;
}

    + '<button class="btn btn-primary btn-md" data-toast="Invoice generated successfully.">' + svg('check-circle',14) + ' Generate Invoice</button>'

}
function kv(k, v){ return '<div class="kv"><span>' + esc(k) + '</span><span>' + v + '</span></div>'; }

function renderPanel(){

}

/* ══════════════════════════════════════════════════════════════════════════
   7. INVOICE DETAIL MODAL + PRINT
   ══════════════════════════════════════════════════════════════════════════ */
function openView(id){
  const i = INVOICES.find(x => x.id === Number(id));
  if (!i) return;
  state.viewId = i.id;
  const intra = i.cgst > 0;
  $('viewTitle').textContent = i.invoiceNumber;
  $('viewBody').innerHTML =
      // Customer information
      '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap">'
    + '<div><p style="margin:0;font-weight:700;color:var(--slate-800);font-size:14px">' + esc(i.billToName) + '</p>'
    + '<p style="margin:2px 0 0;font-size:12px;color:var(--slate-400)">' + esc(i.billToGstin || 'No GSTIN') + ' · ' + esc(i.billToState) + '</p>'
    + '<p style="margin:6px 0 0;font-size:12px;color:var(--slate-500);display:flex;align-items:center;gap:6px">'
    + svg('mail',13) + esc(i.billToEmail) + '</p>'
    + '<p style="margin:2px 0 0;font-size:12px;color:var(--slate-500);display:flex;align-items:center;gap:6px">'
    + svg('phone',13) + esc(i.billToPhone) + '</p></div>'
    + '<div style="text-align:right">' + statusBadge(i.status)
    + '<p style="margin:6px 0 0;font-size:12px;color:var(--slate-400)">' + formatDate(i.invoiceDate)
    + ' · due ' + formatDate(i.dueDate) + '</p></div></div>'

      // Items
    + '<div class="card" style="margin-top:14px;box-shadow:none"><table class="data">'
    + '<thead><tr><th>Item</th><th class="col-r">Qty</th><th class="col-r">Rate</th>'
    + '<th class="col-r">Tax%</th><th class="col-r">Amount</th></tr></thead><tbody>'
    + i.items.map(it => '<tr><td style="font-weight:500;color:var(--slate-700)">' + esc(it.name) + '</td>'
        + '<td class="col-r num">' + it.quantity + ' ' + esc(it.unit) + '</td>'
        + '<td class="col-r num">' + inr(it.rate) + '</td>'
        + '<td class="col-r num">' + it.taxRate + '%</td>'
        + '<td class="col-r num" style="font-weight:600">' + inr(it.amount) + '</td></tr>').join('')
    + '</tbody></table></div>'

      // Totals
    + '<div style="display:flex;justify-content:flex-end;margin-top:14px"><div style="width:260px">'
    + kv('Taxable', inr(i.taxableAmount))
    + (intra ? kv('CGST', inr(i.cgst)) + kv('SGST', inr(i.sgst)) : kv('IGST', inr(i.igst)))
    + kv('Round Off', inr(i.roundOff))
    + '<div style="border-top:1px solid var(--slate-200);padding-top:6px;margin-top:4px;display:flex;justify-content:space-between;font-size:14px;font-weight:800">'
    + '<span>Grand Total</span><span style="color:var(--brand-500)">' + inr(i.grandTotal) + '</span></div>'
    + kv('Paid', inr(i.amountPaid))
    + '<div style="display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--orange-600)">'
    + '<span>Balance Due</span><span>' + inr(i.balanceDue) + '</span></div></div></div>'

      // Payment history
    + (i.payments.length ? '<div style="margin-top:14px">'
        + '<p style="margin:0 0 6px;font-size:11px;font-weight:700;color:var(--slate-500);text-transform:uppercase">Payments</p>'
        + i.payments.map(p => '<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--slate-600);padding:2px 0">'
          + '<span>' + formatDate(p.paymentDate) + ' · ' + esc(p.mode) + ' · ' + esc(p.referenceNumber) + '</span>'
          + '<span style="font-weight:600;color:var(--emerald-600)">' + inr(p.amount) + '</span></div>').join('')
        + '</div>' : '')
    + '<p style="margin:14px 0 0;font-size:10px;color:var(--slate-400)">Last activity: GENERATED by Yogesh Patel · '
    + formatDate(i.invoiceDate) + ', 11:42 AM</p>';

  $('btnPay').style.display = (i.balanceDue > 0 && i.status !== 'Cancelled') ? '' : 'none';
  buildPrintDoc(i);
  $('viewOverlay').hidden = false;
  document.body.style.overflow = 'hidden';
}

/** Builds the A4 document used by both Print and Download (demo). */

    + '<div style="display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #C77E52;padding-bottom:12px">'
    + '<div><h1>' + esc(COMPANY.name) + '</h1>'

    + '<p style="margin:2px 0 0;color:#475569">GSTIN: ' + esc(COMPANY.gstin) + ' · PAN: ' + esc(COMPANY.pan) + '</p></div>'
    + '<div style="text-align:right"><p style="margin:0;font-size:16px;font-weight:800;letter-spacing:.08em">TAX INVOICE</p>'

    + '<p style="margin:2px 0 0;color:#475569">' + esc(i.billToCity) + ', ' + esc(i.billToState) + '</p>'
    + '<p style="margin:2px 0 0;color:#475569">GSTIN: ' + esc(i.billToGstin) + '</p></div>'

      + '<td style="text-align:right">' + inr(it.rate) + '</td>'

    + (intra
        ? '<tr><td>CGST</td><td style="text-align:right">' + inr(i.cgst) + '</td></tr>'
          + '<tr><td>SGST</td><td style="text-align:right">' + inr(i.sgst) + '</td></tr>'
        : '<tr><td>IGST</td><td style="text-align:right">' + inr(i.igst) + '</td></tr>')
    + '<tr><td>Round Off</td><td style="text-align:right">' + inr(i.roundOff) + '</td></tr>'
    + '<tr><td style="font-weight:800">Grand Total</td><td style="text-align:right;font-weight:800">' + inr(i.grandTotal) + '</td></tr>'
    + '<tr><td>Amount Paid</td><td style="text-align:right">' + inr(i.amountPaid) + '</td></tr>'
    + '<tr><td style="font-weight:700">Balance Due</td><td style="text-align:right;font-weight:700">' + inr(i.balanceDue) + '</td></tr>'
    + '</table></div>'

    + '<div style="margin-top:28px;display:flex;justify-content:space-between;align-items:flex-end">'
    + '<div style="color:#64748B;font-size:10px"><p style="margin:0">Bank: HDFC Bank · A/c 50200012345678 · IFSC HDFC0000123</p>'
    + '<p style="margin:2px 0 0">UPI: pulpitmobility@hdfcbank</p>'
    + '<p style="margin:8px 0 0">This is a computer-generated invoice.</p></div>'
    + '<div style="text-align:center"><div style="height:40px"></div>'
    + '<p style="margin:0;border-top:1px solid #94A3B8;padding-top:4px;font-size:10px">Authorised Signatory</p></div></div>'

}

/* ══════════════════════════════════════════════════════════════════════════
   8. EVENTS
   ══════════════════════════════════════════════════════════════════════════ */
function closeModal(id){ $(id).hidden = true; document.body.style.overflow = ''; }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-view],[data-pay],[data-print],[data-toast],[data-goto],[data-close],[data-drop]');
  if (!t) return;

  if (t.dataset.tab)   { state.tab = t.dataset.tab; renderTabs(); renderPanel(); return; }
  if (t.dataset.goto)  { state.tab = t.dataset.goto; renderTabs(); renderPanel(); return; }
  if (t.dataset.view)  { openView(t.dataset.view); return; }
  if (t.dataset.close) { closeModal(t.dataset.close); return; }
  if (t.dataset.toast) { toast(t.dataset.toast); return; }
  if (t.dataset.print) {
    const inv = INVOICES.find(x => x.id === Number(t.dataset.print));
    buildPrintDoc(inv); toast('Opening the print view…', 'info'); setTimeout(() => window.print(), 200); return;
  }
  if (t.dataset.drop)  {
    if (state.draft.length > 1) state.draft.splice(Number(t.dataset.drop), 1);
    renderPanel(); return;
  }
  if (t.dataset.pay)   { openPay(Number(t.dataset.pay)); return; }
});

// Row keyboard activation (matches the app's Enter/Space handling)
document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    document.querySelectorAll('.overlay:not([hidden])').forEach(o => closeModal(o.id));
    return;
  }
  const row = e.target.closest('tr.clickable');
  if (row && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); openView(row.dataset.view); }
});

document.addEventListener('input', e => {
  if (e.target.id === 'invSearch'){
    state.q = e.target.value; renderPanel();
    const el = $('invSearch'); if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  } else if (e.target.id === 'custSearch'){
    state.custQ = e.target.value; renderPanel();
    const el = $('custSearch'); if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  } else if (e.target.dataset.drow){
    state.draft[Number(e.target.dataset.drow)][e.target.dataset.dfield] = e.target.value;
    renderPanel();
  }
});

document.addEventListener('change', e => {
  if (e.target.id === 'statusFilter'){
    const v = e.target.value; state.status = v === 'All Status' ? 'All' : v; renderPanel();
  } else if (e.target.id === 'draftCust'){
    state.draftCustomer = e.target.value; renderPanel();
  } else if (e.target.dataset.drow){
    state.draft[Number(e.target.dataset.drow)][e.target.dataset.dfield] = e.target.value;
    renderPanel();
  } else if (e.target.id === 'txType'){
    toast('Showing ' + e.target.value + '.', 'info');
  }
});

// Add-item button lives inside a re-rendered panel → delegated.
document.addEventListener('click', e => {
  if (e.target.closest('#addLine')){ state.draft.push({ productId:3, quantity:1 }); renderPanel(); }
});

function openPay(id){
  const i = INVOICES.find(x => x.id === id);
  if (!i) return;
  state.payId = id;
  $('payTitle').textContent = 'Record Payment — ' + i.invoiceNumber;
  $('payBalance').textContent = inr(i.balanceDue);
  $('payAmt').value  = i.balanceDue;
  $('payDate').value = '2026-06-30';
  $('payRef').value = ''; $('payNote').value = '';
  $('payOverlay').hidden = false;
}

$('btnPay').addEventListener('click', () => { closeModal('viewOverlay'); openPay(state.viewId); });
$('btnPrint').addEventListener('click', () => { toast('Opening the print view…', 'info'); setTimeout(() => window.print(), 200); });
$('btnDownload').addEventListener('click', () => {
  const i = INVOICES.find(x => x.id === state.viewId);
  toast('Invoice ' + (i ? i.invoiceNumber : '') + ' downloaded as PDF.');
});

$('submitPay').addEventListener('click', () => {
  const i = INVOICES.find(x => x.id === state.payId);
  const amt = Number($('payAmt').value) || 0;
  if (!(amt > 0)){ toast('Enter a valid amount.', 'info'); return; }
  if (amt > i.balanceDue + 0.01){ toast('Amount exceeds the balance due of ' + inr(i.balanceDue) + '.', 'info'); return; }
  i.amountPaid = r2(i.amountPaid + amt);
  i.balanceDue = r2(i.grandTotal - i.amountPaid);
  i.status = i.balanceDue <= 0.01 ? 'Paid' : 'Partially Paid';
  i.payments.unshift({ id:Date.now(), paymentDate:$('payDate').value, mode:$('payMode').value,
                       referenceNumber:$('payRef').value || '—', amount:amt });
  closeModal('payOverlay');
  renderPanel();
  toast('Payment of ' + inr(amt) + ' recorded against ' + i.invoiceNumber + '.');
});

document.querySelectorAll('.overlay').forEach(o => {
  o.addEventListener('click', e => { if (e.target === o) closeModal(o.id); });
});

$('menuToggle').addEventListener('click', () => { $('sidebar').classList.add('open'); $('scrim').hidden = false; });
$('scrim').addEventListener('click', () => { $('sidebar').classList.remove('open'); $('scrim').hidden = true; });

/* ══════════════════════════════════════════════════════════════════════════
   9. BOOT
   ══════════════════════════════════════════════════════════════════════════ */
renderNav();
renderTabs();
renderPanel();
paintIcons(document);
</script>
