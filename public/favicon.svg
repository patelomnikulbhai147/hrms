<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="ZeniaHR logo">
  <!-- ZeniaHR brand mark — geometry mirrors frontend/src/components/brand/ZeniaLogo.tsx -->
  <!-- White tile — reads on both light and dark chrome, with a slate hairline. -->
  <rect width="1024" height="1024" rx="220" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="8"/>
  <!-- Diagonal stroke of the Z — copper, sits beneath the bars. -->
  <line x1="682" y1="422" x2="332" y2="678" stroke="#C77E52" stroke-width="82" stroke-linecap="round"/>
  <!-- Upper and lower bars of the Z — slate ink. -->
  <rect x="298" y="388" width="418" height="72" rx="36" fill="#1E293B"/>
  <rect x="298" y="644" width="418" height="72" rx="36" fill="#1E293B"/>
  <!-- The tittle — slate ink. -->
  <circle cx="511" cy="240" r="76" fill="#1E293B"/>
</svg>
